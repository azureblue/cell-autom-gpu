<html>

<head>
    <title>epdmy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <link rel="shortcut icon" href="img/favicon.ico">
    <style>
        * {
            border: 0px;
            width: 100%;
            height: 100%;
            margin: 0px;
        }

        canvas {
            position: absolute;
            background: transparent;
        }
    </style>

    <script src="gl.js"></script>
    <script src="geom.js"></script>
    <script src="entity.js"></script>
    <script src="color.js"></script>
    <script src="ca.js"></script>

    <script>
        var canvas;
        function getCanvas() {
            return document.getElementById("canvas");
        }

        function updateCanvasSize() {
            canvas = getCanvas();
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        var ca = new CA(100, 100);

        function start() {
            updateCanvasSize();
            ca.init(getCanvas()).then(() => nextIteration());
            // nextIteration();

            window.addEventListener("resize", resizeCallback);

            function resizeCallback() {
                updateCanvasSize();
                ca.updateSize();
            }

            var frame = 0;

            let entities = [];
            for (let i = 0; i < 500; i++) {
                entities.push(new RandomWalkingEntity(
                    vec(Math.random() * canvas.clientWidth, Math.random() * canvas.clientHeight),
                    Math.random() * Math.PI * 2));
            }

            function nextIteration() {
                ca.render(entities);
                entities.forEach(en => {
                    en.updatePos(2);
                    if (Math.random() < 0.04)
                        en.logicTick();
                });


                frame++;
                requestAnimationFrame(nextIteration);
            }
        }


    </script>
</head>

<body onload="start()">
    <canvas id="canvas"></canvas>
</body>

</html>
